name: Publish Node.js SDK

on:
  push:
    tags: ['node-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check only; do not publish'
        type: boolean
        default: true
      publish:
        description: 'Type "publish" to confirm a real release (also requires dry_run off)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    defaults:
      run:
        working-directory: sdk/codemie-nodejs
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'

      # The Node.js SDK has no committed lock file, so `npm ci` cannot be used.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check version against npm
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: python3 ../../scripts/release/check_version.py --ecosystem npm --name codemie-sdk --version "$VERSION"

      - name: Require a package tag for a real publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.publish == 'publish'
        run: |
          case "$GITHUB_REF" in
            refs/tags/node-v*) ;;
            *) echo "A real publish must run from a node-v* tag, not $GITHUB_REF"; exit 1 ;;
          esac

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: python3 ../../scripts/release/check_version.py --ecosystem npm --name codemie-sdk --version "$VERSION" --tag "$GITHUB_REF_NAME"

      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP/pack" && cp "$RUNNER_TEMP"/pack/*.tgz "$GITHUB_WORKSPACE/"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-package
          path: codemie-sdk-*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: verify
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch'
      && inputs.dry_run == false && inputs.publish == 'publish'
      && startsWith(github.ref, 'refs/tags/node-v'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-package
          path: package/

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # A pre-release version must not take the default `latest` dist-tag.
          if [[ "$VERSION" == *-* ]]; then
            npm publish package/codemie-sdk-*.tgz --access public --tag next
          else
            npm publish package/codemie-sdk-*.tgz --access public
          fi
